name: Ekstrak ZIP dan Build APK

# Satu workflow, dua job: (1) ekstrak ZIP, (2) build APK.
# Jalan otomatis saat ada ZIP baru di root repo atau file aplikasi berubah,
# atau manual lewat tab Actions > Run workflow.
on:
  push:
    paths:
      - '*.zip'
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # JOB 1: ekstrak ZIP ke root repo (dilewati kalau tidak ada ZIP)
  # ---------------------------------------------------------------
  ekstrak:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Ekstrak ZIP ke root repo
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then
            echo "Tidak ada file .zip di root repo, langkah ekstrak dilewati."
            exit 0
          fi
          echo "Mengekstrak: $ZIP"
          rm -rf _tmp_extract && mkdir _tmp_extract
          unzip -q -o "$ZIP" -d _tmp_extract
          rm -rf _tmp_extract/__MACOSX
          # kalau semua isi dibungkus satu folder, naikkan ke root
          if [ "$(ls -A _tmp_extract | wc -l)" -eq 1 ] && [ -d "_tmp_extract/$(ls -A _tmp_extract)" ]; then
            cp -a _tmp_extract/*/. .
          else
            cp -a _tmp_extract/. .
          fi
          rm -rf _tmp_extract "$ZIP"

      - name: Pastikan file penting ada
        run: |
          for f in package.json capacitor.config.json www/index.html; do
            [ -f "$f" ] || { echo "::error::$f tidak ditemukan. Upload ZIP aplikasi ke root repo dulu."; exit 1; }
          done

      - name: Commit hasil ekstrak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
          else
            git commit -m "Ekstrak ZIP otomatis"
            git push
          fi

  # ---------------------------------------------------------------
  # JOB 2: build APK (jalan setelah job 1 selesai)
  # ---------------------------------------------------------------
  build:
    needs: ekstrak
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ambil repo (versi terbaru setelah ekstrak)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pasang Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependency
        run: npm install --no-audit --no-fund

      - name: Buat project Android (sekali saja)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate ikon aplikasi
        continue-on-error: true
        run: |
          if [ -f assets/icon-only.png ]; then
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#16332B' --iconBackgroundColorDark '#16332B'
          fi

      - name: Sinkronkan web ke Android
        run: npx cap sync android

      - name: Terima lisensi Android SDK
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BukuKerjaAkuntansi.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: BukuKerjaAkuntansi-APK
          path: BukuKerjaAkuntansi.apk

      - name: Rilis APK (link unduh langsung)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: Unduh BukuKerjaAkuntansi.apk lalu install di Android (izinkan install dari sumber ini).
          files: BukuKerjaAkuntansi.apk
